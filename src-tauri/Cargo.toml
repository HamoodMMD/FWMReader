[package]
name = "claude-chat-archive-viewer"
version = "0.1.0"
description = "Local-first AI conversation archive browser"
authors = ["FWM's Claude Chat Archive Viewer contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "claude_chat_archive_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

